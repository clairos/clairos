<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="title desc">
<title id="title">Hi, I'm Ana Clara</title>
<desc id="desc">A design canvas where a cursor named Clara selects the name Ana Clara and flips a toggle, while a cursor named you drags a slider.</desc>
<defs>
<style>
@font-face { font-family: "D"; font-weight: 600; src: url(data:font/woff;base64,) format("woff"); }
@font-face { font-family: "DM"; font-weight: 500; src: url(data:font/woff;base64,) format("woff"); }
@font-face { font-family: "T"; font-weight: 500; src: url(data:font/woff;base64,) format("woff"); }
.t { font-family: "T", Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 500; }
.hi { font-family: "DM", Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 500; }
.name { font-family: "D", Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: -0.01em; }

.rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
.d1 { animation-delay: .25s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.loop { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.45,0,.25,1); animation-delay: 1s; animation-fill-mode: both; }
#clara { animation-name: clara; transform: translate(496px, 236px); }
#you { animation-name: you; transform: translate(850px, 226px); }
@keyframes clara {
  0% { transform: translate(1060px, 410px); }
  8% { transform: translate(1060px, 410px); }
  20% { transform: translate(87px, 148px); }
  22% { transform: translate(87px, 148px); animation-timing-function: linear; }
  31% { transform: translate(490px, 232px); }
  38% { transform: translate(496px, 236px); }
  48% { transform: translate(818px, 170px); }
  52% { transform: translate(818px, 170px); }
  60% { transform: translate(828px, 176px); }
  72% { transform: translate(1060px, -40px); }
  100% { transform: translate(1060px, -40px); }
}
@keyframes you {
  0% { transform: translate(-60px, 420px); }
  50% { transform: translate(-60px, 420px); }
  61% { transform: translate(700px, 226px); }
  63% { transform: translate(700px, 226px); }
  75% { transform: translate(850px, 226px); }
  77% { transform: translate(850px, 226px); }
  86% { transform: translate(730px, 174px); }
  93% { transform: translate(730px, 174px); }
  100% { transform: translate(-60px, 420px); }
}

.press { transform-box: fill-box; transform-origin: 0 0; }
#clara .press { animation: clickA 12s 1s infinite both; }
#you .press { animation: clickB 12s 1s infinite both; }
@keyframes clickA { 0%, 20%, 23%, 48.5%, 51%, 100% { transform: none; } 21%, 22%, 49.5% { transform: scale(.88); } }
@keyframes clickB { 0%, 61%, 77%, 88%, 90%, 100% { transform: none; } 62%, 76%, 89% { transform: scale(.88); } }

#marquee { transform-box: fill-box; transform-origin: 0 0; animation: marquee 12s 1s infinite both linear; }
@keyframes marquee {
  0%, 22% { opacity: 0; transform: scale(0); }
  22.1% { opacity: 1; transform: scale(0); }
  31% { opacity: 1; transform: scale(1); animation-timing-function: steps(1); }
  31.1%, 100% { opacity: 0; transform: scale(1); }
}
#sel { animation: sel 12s 1s infinite both; }
@keyframes sel { 0%, 31% { opacity: 0; } 31.5%, 88% { opacity: 1; } 92%, 100% { opacity: 0; } }

#knob { animation: knob 12s 1s infinite both; }
#track-on { animation: trackon 12s 1s infinite both; }
@keyframes knob { 0%, 50% { transform: none; } 53%, 94% { transform: translateX(22px); } 97%, 100% { transform: none; } }
@keyframes trackon { 0%, 50% { opacity: 0; } 53%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }

#sknob { animation: sknob 12s 1s infinite both cubic-bezier(.45,0,.25,1); }
#sfill { transform-box: fill-box; transform-origin: 0 50%; animation: sfill 12s 1s infinite both cubic-bezier(.45,0,.25,1); }
@keyframes sknob { 0%, 63% { transform: none; } 75%, 95% { transform: translateX(150px); } 100% { transform: none; } }
@keyframes sfill { 0%, 63% { transform: scaleX(1); } 75%, 95% { transform: scaleX(4.750); } 100% { transform: scaleX(1); } }

#btn-hover { animation: hover 12s 1s infinite both; }
@keyframes hover { 0%, 85% { opacity: 0; } 86.5%, 93% { opacity: 1; } 95%, 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  #marquee, #btn-hover { opacity: 0; }
}
</style>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity=".07"/></pattern>
<clipPath id="card"><rect width="1000" height="380" rx="24"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="1000" height="380" fill="#0F1311"/>
  <rect width="1000" height="380" fill="url(#dots)"/>

  <text x="48" y="48" class="t" font-size="12" fill="#7D8681">hello</text>
  <rect x="48" y="58" width="904" height="282" fill="#151A17" stroke="#FFFFFF" stroke-opacity=".06"/>

  <text x="98" y="136" class="hi rise" font-size="30" fill="#9BA59F">Hi, I&#8217;m</text>
  <text x="96" y="222" class="name rise d1" font-size="88" fill="#ECEFEC">Ana Clara</text>
  <text x="98" y="300" class="t rise d2" font-size="19" fill="#8C958F">Product design, design systems and front-end.</text>

  <rect id="marquee" x="87" y="148" width="403" height="84" fill="#3CB878" fill-opacity=".1" stroke="#3CB878" stroke-width="1"/>
  <g id="sel">
    <rect x="87" y="148" width="403" height="84" fill="none" stroke="#3CB878" stroke-width="1.5"/>
    <rect x="83" y="144" width="8" height="8" fill="#FFFFFF" stroke="#3CB878" stroke-width="1.5"/><rect x="486" y="144" width="8" height="8" fill="#FFFFFF" stroke="#3CB878" stroke-width="1.5"/><rect x="83" y="228" width="8" height="8" fill="#FFFFFF" stroke="#3CB878" stroke-width="1.5"/><rect x="486" y="228" width="8" height="8" fill="#FFFFFF" stroke="#3CB878" stroke-width="1.5"/>
    <rect x="254.0" y="240" width="69.0" height="20" rx="4" fill="#3CB878"/>
    <text x="288.5" y="254" text-anchor="middle" class="t" font-size="12" fill="#0F1311">403 × 84</text>
  </g>

  <g class="rise d3">
    <text x="640" y="84" class="t" font-size="12" fill="#7D8681">Components</text>
    <rect x="640" y="96" width="272" height="214" rx="16" fill="#1C221F" stroke="#FFFFFF" stroke-opacity=".08"/>
    <rect x="660" y="148" width="112" height="40" rx="20" fill="#1B7D4F"/>
    <rect id="btn-hover" x="660" y="148" width="112" height="40" rx="20" fill="#26A267"/>
    <text x="716.0" y="173" text-anchor="middle" class="t" font-size="15" fill="#F4F7F5">Say hi</text>

    <rect x="792" y="155" width="48" height="26" rx="13" fill="#FFFFFF" fill-opacity=".14"/>
    <rect id="track-on" x="792" y="155" width="48" height="26" rx="13" fill="#3CB878"/>
    <circle id="knob" cx="805" cy="168" r="10" fill="#F4F7F5"/>

    <rect x="660" y="222" width="232" height="4" rx="2" fill="#FFFFFF" fill-opacity=".14"/>
    <rect id="sfill" x="660" y="222" width="40" height="4" rx="2" fill="#3CB878"/>
    <circle id="sknob" cx="700" cy="224" r="9" fill="#F4F7F5" stroke="#3CB878" stroke-width="2"/>

    <circle cx="671" cy="283" r="11" fill="#0F3D27" stroke="#FFFFFF" stroke-opacity=".12"/><circle cx="701" cy="283" r="11" fill="#1B7D4F" stroke="#FFFFFF" stroke-opacity=".12"/><circle cx="731" cy="283" r="11" fill="#3CB878" stroke="#FFFFFF" stroke-opacity=".12"/><circle cx="761" cy="283" r="11" fill="#9FE3BF" stroke="#FFFFFF" stroke-opacity=".12"/><circle cx="791" cy="283" r="11" fill="#ECEFEC" stroke="#FFFFFF" stroke-opacity=".12"/>
  </g>

  <g><g id="you" class="loop"><g class="press">
    <path d="M0 0 L0 19 L4.6 14.6 L7.6 21.4 L10.6 20.1 L7.7 13.4 L14 13.4 Z" fill="#F7A8CB" stroke="#0F1311" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="12" y="20" width="39.1" height="22" rx="11" fill="#F7A8CB"/>
    <text x="20" y="35.5" class="t" font-size="13" fill="#2A1320">you</text>
  </g></g></g>
  <g id="clara" class="loop"><g class="press">
    <path d="M0 0 L0 19 L4.6 14.6 L7.6 21.4 L10.6 20.1 L7.7 13.4 L14 13.4 Z" fill="#3CB878" stroke="#0F1311" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="12" y="20" width="48.6" height="22" rx="11" fill="#3CB878"/>
    <text x="20" y="35.5" class="t" font-size="13" fill="#0F1311">Clara</text>
  </g></g>
  <rect width="999" height="379" x=".5" y=".5" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</g>
</svg>
