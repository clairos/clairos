<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="Thanks for stopping by.">
<defs><style>
@font-face { font-family: "D"; src: url(data:font/woff;base64,) format("woff"); }
@font-face { font-family: "T"; src: url(data:font/woff;base64,) format("woff"); }
.d { font-family: "D", Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 500; }
.t { font-family: "T", Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 500; }
#clara { animation: a 5s ease-in-out infinite; }
#you { animation: b 5s ease-in-out infinite; }
@keyframes a { 0%,100% { transform: translate(720px,34px); } 25% { transform: translate(742px,26px); } 50% { transform: translate(730px,44px); } 75% { transform: translate(748px,38px); } }
@keyframes b { 0%,100% { transform: translate(850px,48px); } 25% { transform: translate(834px,38px); } 50% { transform: translate(856px,30px); } 75% { transform: translate(840px,52px); } }
.caret { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
</style>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity=".07"/></pattern>
<clipPath id="c"><rect width="1000" height="120" rx="24"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="1000" height="120" fill="#0F1311"/><rect width="1000" height="120" fill="url(#dots)"/>
<text x="56" y="70" class="d" font-size="30" fill="#ECEFEC">Thanks for stopping by.</text>
<rect class="caret" x="375" y="44" width="2.5" height="34" fill="#3CB878"/>
<g id="you"><path d="M0 0 L0 19 L4.6 14.6 L7.6 21.4 L10.6 20.1 L7.7 13.4 L14 13.4 Z" fill="#F7A8CB" stroke="#0F1311" stroke-width="1.2" stroke-linejoin="round"/>
<rect x="12" y="20" width="39.1" height="22" rx="11" fill="#F7A8CB"/><text x="20" y="35.5" class="t" font-size="13" fill="#2A1320">you</text></g>
<g id="clara"><path d="M0 0 L0 19 L4.6 14.6 L7.6 21.4 L10.6 20.1 L7.7 13.4 L14 13.4 Z" fill="#3CB878" stroke="#0F1311" stroke-width="1.2" stroke-linejoin="round"/>
<rect x="12" y="20" width="48.6" height="22" rx="11" fill="#3CB878"/><text x="20" y="35.5" class="t" font-size="13" fill="#0F1311">Clara</text></g>
<rect x=".5" y=".5" width="999" height="119" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</g></svg>
